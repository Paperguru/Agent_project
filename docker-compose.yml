services:
  postgres:
    image: postgres:16
    container_name: life-inbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: life_inbox
    ports:
      - "5432:5432"
    volumes:
      - life_inbox_pgdata:/var/lib/postgresql/data

volumes:
  life_inbox_pgdata:
